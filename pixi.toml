[workspace]
authors = ["Wilfredo Torres Calderon <31073887+wtorresc@users.noreply.github.com>"]
channels = ["conda-forge"]
name = "aml"
description = "Applied Machine Learning for CEE: lecture decks (PowerPoint via pandoc), figure scripts, and companion marimo notebooks"
# linux-64 with an NVIDIA GPU (CUDA 12): the RTX 3090 Ti, driver CUDA 13.2; conda's runtime is 12.9
platforms = [{ name = "linux-64-cuda-12", platform = "linux-64", cuda = "12" }]
version = "0.1.0"

[tasks]
edit = { cmd = "marimo edit notebooks/", description = "Open the marimo notebook editor on the notebooks/ directory" }
export-ipynb = { cmd = "python scripts/export_notebooks.py", description = "Export all marimo .py notebooks to Jupyter .ipynb" }

# Versions pinned to those every lecture's numbers were made with (2026-11-15/17): declaring CUDA
# re-solves the environment from scratch, and unpinned specs would move to the latest releases.
[feature.ml.dependencies]
python = "==3.12.13"
numpy = "==2.4.5"
scipy = "==1.17.1"
scikit-learn = "==1.8.0"
matplotlib = "==3.10.9"
pandas = "==3.0.3"
pytorch = { version = "==2.10.0", build = "cuda*" }  # the CPU build of the same version until 2026-11-17
faiss-gpu = "==1.10.0"
mdbtools = "==1.0.1"
wntr = "==1.5.0"
statsmodels = "==0.14.6"
pyyaml = "==6.0.3"
torchvision = { version = "==0.26.0", build = "cuda*" }
# numerics and image decoding that the lectures' numbers depend on (transitive before)
mkl = "==2025.3.1"
llvm-openmp = "==22.1.5"
pillow = "==12.2.0"
libjpeg-turbo = "==3.1.4.1"
joblib = "==1.5.3"
threadpoolctl = "==3.6.0"
networkx = "==3.6.1"
freetype = "==2.14.3"
python-dateutil = "==2.9.0.post0"  # pandas parses dates with it
contourpy = "==1.3.3"
kiwisolver = "==1.5.0"
fonttools = "==4.63.0"
tbb = "==2023.0.0"
patsy = "==1.0.2"
libgcc = "==15.2.0"
libstdcxx = "==15.2.0"
libgfortran = "==15.2.0"
chronos-forecasting = "==2.3.2"
ifcopenshell = "==0.9.0post1"  # reads the IFC (BIM) model of Lecture 22 (LGPL-3.0)
# The Hugging Face stack (BERT, CLIP, SAM 2.1, GPT-2, Qwen, BGE, Chronos-2: L17-L20, L25), pinned
# 2026-11-19 at the versions already locked (before, only chronos-forecasting pulled them in).
transformers = "==5.23.0"
tokenizers = "==0.23.3"
huggingface_hub = "==2.4.0"

[feature.ml.pypi-dependencies]
eclipse-sumo = "==1.28.0"
libsumo = "==1.28.0"

[feature.notebook.dependencies]
marimo = "==0.23.5"
jupyter = "==1.1.1"
ipykernel = "==7.2.0"
nbformat = "==5.10.4"
pypdf = "==6.11.0"

[environments]
aml-env = { features = ["ml", "notebook"], solve-group = "default" }
